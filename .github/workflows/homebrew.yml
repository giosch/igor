name: Homebrew

on:
  push:
    branches: [main]
    paths:
      - Formula/igor.rb
      - .github/workflows/homebrew.yml
      - src/**
      - tests/**
      - examples/**
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install the published formula
        id: install
        run: |
          brew tap giosch/igor https://github.com/giosch/igor.git
          git -C "$(brew --repository giosch/igor)" checkout --detach "$GITHUB_SHA"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install giosch/igor/igor
          igor --version
          echo "$(brew --prefix node@24)/bin" >> "$GITHUB_PATH"
          echo "IGOR_TEST_PI=$(brew --prefix giosch/igor/igor)/libexec/bin/pi" >> "$GITHUB_ENV"
          echo "IGOR_REQUIRE_PI=1" >> "$GITHUB_ENV"
      - name: Run the formula's installation test
        run: brew test --verbose giosch/igor/igor
      - name: Exercise pending changes on macOS
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cd "$(brew --repository giosch/igor)"
          installed="$(brew --prefix giosch/igor/igor)/libexec"
          if ! diff -qr src "$installed/src" || ! diff -qr tests "$installed/tests"; then
            npm test
          fi
      - name: Exercise the installed package and native Seatbelt with Pi
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cd "$(brew --prefix giosch/igor/igor)/libexec"
          npm test
